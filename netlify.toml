[build]
  command = "npm run build"
  publish = "dist"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

# ---- Przekierowania 301 ze starej strony topstrony.pl ----
# Strona główna i stare odpowiedniki
[[redirects]]
  from = "/index"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/index.php"
  to = "/"
  status = 301
  force = true
[[redirects]]
  from = "/strona-glowna"
  to = "/"
  status = 301
  force = true

